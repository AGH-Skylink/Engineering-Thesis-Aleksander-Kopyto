[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nv-lab-architecture-starter"
version = "0.0.1"
description = "Offline educational architecture for an NV measurement automation project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hardware = ["qcodes", "pyvisa", "pyvisa-py"]
gui = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15"]

[tool.setuptools.packages.find]
where = ["src"]
