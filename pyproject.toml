[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nv-lab-architecture-starter"
version = "0.0.1"
description = "Offline educational architecture for an NV measurement automation project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hardware = ["qcodes", "pyvisa", "pyvisa-py>=0.8.1", "pyusb>=1.2,<2", "libusb-package>=1.0.26; sys_platform == 'win32'", "pulsestreamer>=2,<3"]
gui = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15"]

[tool.setuptools.packages.find]
where = ["src"]
